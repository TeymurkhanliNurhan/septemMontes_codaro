<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Septem Montes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #14231c;
        --moss: #1f4d3a;
        --leaf: #2f6b4f;
        --mist: #e8efe9;
        --sand: #d4c4a8;
        --paper: #f7f5f0;
        --danger: #9b2c2c;
        --radius: 10px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Source Sans 3', sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, #c5d9ce 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #e2d6c2 0%, transparent 50%),
          linear-gradient(160deg, #f3efe6 0%, #e7eee9 45%, #dfe8e2 100%);
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .shell {
        width: min(420px, 100%);
        animation: rise 0.55s ease-out both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand {
        text-align: center;
        margin-bottom: 1.75rem;
      }

      .brand h1 {
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-weight: 700;
        font-size: clamp(2rem, 5vw, 2.5rem);
        letter-spacing: -0.02em;
        color: var(--moss);
      }

      .brand p {
        margin: 0.4rem 0 0;
        color: #4a5c52;
        font-size: 1rem;
      }

      form {
        background: color-mix(in srgb, var(--paper) 88%, white);
        border: 1px solid color-mix(in srgb, var(--sand) 70%, transparent);
        border-radius: calc(var(--radius) + 4px);
        padding: 1.5rem 1.4rem 1.35rem;
        box-shadow: 0 18px 40px rgba(20, 35, 28, 0.08);
        display: grid;
        gap: 1rem;
        animation: rise 0.7s ease-out 0.08s both;
      }

      label {
        display: grid;
        gap: 0.35rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #2d3d35;
      }

      input,
      select {
        width: 100%;
        border: 1px solid #c9d5cd;
        border-radius: var(--radius);
        background: #fff;
        color: var(--ink);
        font: inherit;
        padding: 0.7rem 0.8rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: var(--leaf);
        box-shadow: 0 0 0 3px rgba(47, 107, 79, 0.18);
      }

      button {
        margin-top: 0.35rem;
        border: 0;
        border-radius: var(--radius);
        background: linear-gradient(180deg, var(--leaf), var(--moss));
        color: #f5faf7;
        font: inherit;
        font-weight: 600;
        padding: 0.8rem 1rem;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      button:hover:not(:disabled) {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .message {
        min-height: 1.25rem;
        font-size: 0.9rem;
        text-align: center;
      }

      .message.error {
        color: var(--danger);
      }

      .message.success {
        color: var(--moss);
      }

      .hint {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.85rem;
        color: #5b6b62;
      }

      .hint a {
        color: var(--moss);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <h1>Septem Montes</h1>
        <p>Sign in with your email and password</p>
      </header>

      <form id="signin-form" novalidate>
        <label>
          Email
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
            placeholder="you@example.com"
          />
        </label>

        <label>
          Password
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            minlength="8"
            placeholder="At least 8 characters"
          />
        </label>

        <button type="submit" id="submit-btn">Sign in</button>
        <div class="message" id="message" aria-live="polite"></div>
      </form>

      <p class="hint">
        No account yet?
        <a href="/signup.html">Sign up as a worker</a>
        ·
        <a href="/api" target="_blank" rel="noopener">Swagger</a>
      </p>
    </main>

    <script>
      // Always sign in against Septem Montes (server also forces this org).
      const form = document.getElementById('signin-form');
      const message = document.getElementById('message');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = '';
        message.className = 'message';
        submitBtn.disabled = true;

        const payload = {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        };

        try {
          const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload),
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            const detail =
              data.message?.toString?.() ||
              (Array.isArray(data.message) ? data.message.join(', ') : null) ||
              'Sign in failed';
            throw new Error(detail);
          }

          localStorage.setItem('user', JSON.stringify(data));

          message.className = 'message success';
          message.textContent = `Welcome, ${data.name}. Redirecting…`;
          window.location.href = '/resources.html';
        } catch (error) {
          message.className = 'message error';
          message.textContent = error.message || 'Sign in failed';
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
