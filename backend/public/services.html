<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services · Septem Montes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #14231c;
        --moss: #1f4d3a;
        --leaf: #2f6b4f;
        --mist: #e8efe9;
        --sand: #d4c4a8;
        --paper: #f7f5f0;
        --danger: #9b2c2c;
        --warn: #8a5a12;
        --radius: 10px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Source Sans 3', sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, #c5d9ce 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #e2d6c2 0%, transparent 50%),
          linear-gradient(160deg, #f3efe6 0%, #e7eee9 45%, #dfe8e2 100%);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid color-mix(in srgb, var(--moss) 12%, transparent);
        background: color-mix(in srgb, var(--paper) 70%, white);
        animation: rise 0.45s ease-out both;
      }

      header h1 {
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(1.6rem, 3vw, 2rem);
        color: var(--moss);
      }

      header .meta {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: #4a5c52;
        font-size: 0.95rem;
      }

      header nav {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }

      header nav a {
        color: var(--moss);
        text-decoration: none;
        font-weight: 600;
      }

      header nav a[aria-current='page'] {
        text-decoration: underline;
        text-underline-offset: 0.25rem;
      }

      main {
        width: min(1100px, 100%);
        margin: 0 auto;
        padding: 1.5rem;
        animation: rise 0.55s ease-out both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1.6fr 1fr auto;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      @media (max-width: 800px) {
        .toolbar {
          grid-template-columns: 1fr;
        }
        header {
          flex-direction: column;
          align-items: flex-start;
        }
      }

      input,
      select,
      textarea,
      button {
        font: inherit;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid color-mix(in srgb, var(--moss) 20%, #ccd8d1);
        background: #fff;
        border-radius: var(--radius);
        padding: 0.7rem 0.85rem;
        color: var(--ink);
      }

      button {
        border: 0;
        border-radius: var(--radius);
        padding: 0.7rem 1rem;
        background: var(--moss);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      button.secondary {
        background: transparent;
        color: var(--moss);
        border: 1px solid color-mix(in srgb, var(--moss) 35%, transparent);
      }

      button.danger {
        background: var(--danger);
      }

      .panel {
        background: color-mix(in srgb, var(--paper) 88%, white);
        border: 1px solid color-mix(in srgb, var(--moss) 10%, transparent);
        border-radius: 14px;
        padding: 1rem;
        box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 6%, transparent);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 0.85rem 0.6rem;
        border-bottom: 1px solid var(--mist);
        vertical-align: middle;
      }

      th {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #4a5c52;
      }

      .status {
        display: inline-block;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .status.active {
        background: color-mix(in srgb, var(--leaf) 18%, white);
        color: var(--moss);
      }

      .status.inactive {
        background: color-mix(in srgb, var(--sand) 55%, white);
        color: var(--warn);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .actions button {
        padding: 0.4rem 0.65rem;
        font-size: 0.85rem;
      }

      .message {
        margin: 0.75rem 0 1rem;
        min-height: 1.25rem;
        font-size: 0.95rem;
      }

      .message.error {
        color: var(--danger);
      }

      .message.success {
        color: var(--leaf);
      }

      .empty,
      .loading,
      .error-state {
        padding: 2rem 1rem;
        text-align: center;
        color: #4a5c52;
      }

      .pager {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-top: 1rem;
        color: #4a5c52;
      }

      dialog {
        border: 0;
        border-radius: 14px;
        padding: 0;
        width: min(560px, calc(100vw - 2rem));
        background: color-mix(in srgb, var(--paper) 92%, white);
        box-shadow: 0 20px 50px color-mix(in srgb, var(--ink) 18%, transparent);
      }

      dialog.wide {
        width: min(820px, calc(100vw - 2rem));
      }

      dialog::backdrop {
        background: color-mix(in srgb, var(--ink) 45%, transparent);
      }

      .dialog-body {
        padding: 1.25rem;
      }

      .dialog-body h2 {
        margin: 0 0 1rem;
        font-family: Fraunces, Georgia, serif;
        color: var(--moss);
      }

      label {
        display: grid;
        gap: 0.35rem;
        margin-bottom: 0.85rem;
        font-weight: 500;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0.75rem;
      }

      @media (max-width: 640px) {
        .field-row {
          grid-template-columns: 1fr;
        }
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.6rem;
        margin-top: 0.5rem;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 1rem 0 0.85rem;
      }

      .tabs button {
        padding: 0.45rem 0.8rem;
        font-size: 0.9rem;
        background: transparent;
        color: var(--moss);
        border: 1px solid color-mix(in srgb, var(--moss) 28%, transparent);
      }

      .tabs button.active {
        background: var(--moss);
        color: #fff;
        border-color: var(--moss);
      }

      .tab-panel[hidden] {
        display: none;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        margin: 0.5rem 0 0.75rem;
      }

      .section-head h3 {
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-size: 1.15rem;
        color: var(--moss);
      }

      .detail-grid {
        display: grid;
        gap: 0.75rem;
      }

      .detail-grid dt {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #4a5c52;
      }

      .detail-grid dd {
        margin: 0.15rem 0 0;
      }

      .placeholder {
        margin-top: 1rem;
        padding: 0.85rem;
        border: 1px dashed color-mix(in srgb, var(--moss) 25%, transparent);
        border-radius: var(--radius);
        color: #4a5c52;
      }

      .resource-picker {
        max-height: 280px;
        overflow: auto;
        border: 1px solid color-mix(in srgb, var(--moss) 15%, transparent);
        border-radius: var(--radius);
        background: #fff;
        padding: 0.35rem;
      }

      .resource-option {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.55rem 0.65rem;
        border-radius: 8px;
        cursor: pointer;
      }

      .resource-option:hover {
        background: var(--mist);
      }

      .resource-option input {
        width: auto;
      }

      .muted {
        color: #4a5c52;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Services</h1>
        <div class="meta" id="user-meta">Loading…</div>
      </div>
      <div class="meta">
        <nav>
          <a href="/resources.html">Resources</a>
          <a href="/services.html" aria-current="page">Services</a>
          <a href="/bookings.html">Bookings</a>
        </nav>
        <a href="/signin.html">Sign in</a>
        <button type="button" class="secondary" id="logout-btn">Log out</button>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search by name" />
        <select id="status-filter">
          <option value="">All statuses</option>
          <option value="ACTIVE">ACTIVE</option>
          <option value="INACTIVE">INACTIVE</option>
        </select>
        <button type="button" id="create-btn">Create service</button>
      </div>

      <div class="message" id="toast" aria-live="polite"></div>

      <section class="panel">
        <div id="list-state" class="loading">Loading services…</div>
        <div id="table-wrap" hidden>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Duration</th>
                <th>Buffer</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="pager">
            <span id="page-meta"></span>
            <div class="actions">
              <button type="button" class="secondary" id="prev-page">Previous</button>
              <button type="button" class="secondary" id="next-page">Next</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <dialog id="form-dialog">
      <form class="dialog-body" id="service-form">
        <h2 id="form-title">Create service</h2>
        <input type="hidden" id="edit-id" />
        <label>
          Name
          <input id="name" required maxlength="255" />
        </label>
        <label>
          Description
          <textarea id="description" rows="3" maxlength="5000" placeholder="optional"></textarea>
        </label>
        <div class="field-row">
          <label>
            Duration (minutes)
            <input id="durationMinutes" type="number" min="1" step="1" required />
          </label>
          <label>
            Buffer before
            <input id="bufferBeforeMinutes" type="number" min="0" step="1" value="0" />
          </label>
          <label>
            Buffer after
            <input id="bufferAfterMinutes" type="number" min="0" step="1" value="0" />
          </label>
        </div>
        <label>
          Metadata (JSON object)
          <textarea id="metadata" rows="5" placeholder="{}"></textarea>
        </label>
        <div class="message" id="form-message"></div>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancel-form">Cancel</button>
          <button type="submit" id="save-btn">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="detail-dialog" class="wide">
      <div class="dialog-body">
        <h2 id="detail-title">Service detail</h2>
        <div class="tabs" role="tablist">
          <button type="button" class="active" data-tab="overview">Overview</button>
          <button type="button" data-tab="resources">Resources</button>
          <button type="button" data-tab="bookings">Bookings</button>
        </div>

        <div class="tab-panel" id="tab-overview">
          <dl class="detail-grid" id="detail-content"></dl>
        </div>
        <div class="tab-panel" id="tab-resources" hidden>
          <div class="section-head">
            <h3>Linked resources</h3>
            <button type="button" id="attach-btn" hidden>Attach resource</button>
          </div>
          <div id="linked-state" class="loading">Loading resources…</div>
          <div id="linked-wrap" hidden>
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="linked-rows"></tbody>
            </table>
          </div>
        </div>
        <div class="tab-panel" id="tab-bookings" hidden>
          <div class="placeholder">Bookings — coming soon</div>
        </div>

        <div class="dialog-actions">
          <button type="button" class="secondary" id="close-detail">Close</button>
        </div>
      </div>
    </dialog>

    <dialog id="attach-dialog">
      <form class="dialog-body" id="attach-form">
        <h2>Attach resource</h2>
        <label>
          Search resources
          <input id="attach-search" type="search" placeholder="Filter by name" />
        </label>
        <div class="resource-picker" id="attach-options"></div>
        <div class="message" id="attach-message"></div>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancel-attach">Cancel</button>
          <button type="submit" id="attach-save-btn">Attach</button>
        </div>
      </form>
    </dialog>

    <script>
      const MUTATE_ROLES = new Set(['OWNER', 'ADMIN']);
      const READ_ROLES = new Set(['OWNER', 'ADMIN', 'STAFF']);

      const state = {
        page: 1,
        limit: 10,
        totalPages: 1,
        loading: false,
        user: null,
        canMutate: false,
        detailServiceId: null,
        detailTab: 'overview',
        linkedResources: [],
        attachCandidates: [],
        selectedResourceId: null,
      };

      const els = {
        toast: document.getElementById('toast'),
        userMeta: document.getElementById('user-meta'),
        listState: document.getElementById('list-state'),
        tableWrap: document.getElementById('table-wrap'),
        rows: document.getElementById('rows'),
        pageMeta: document.getElementById('page-meta'),
        search: document.getElementById('search'),
        statusFilter: document.getElementById('status-filter'),
        createBtn: document.getElementById('create-btn'),
        prevPage: document.getElementById('prev-page'),
        nextPage: document.getElementById('next-page'),
        formDialog: document.getElementById('form-dialog'),
        detailDialog: document.getElementById('detail-dialog'),
        form: document.getElementById('service-form'),
        formTitle: document.getElementById('form-title'),
        formMessage: document.getElementById('form-message'),
        editId: document.getElementById('edit-id'),
        name: document.getElementById('name'),
        description: document.getElementById('description'),
        durationMinutes: document.getElementById('durationMinutes'),
        bufferBeforeMinutes: document.getElementById('bufferBeforeMinutes'),
        bufferAfterMinutes: document.getElementById('bufferAfterMinutes'),
        metadata: document.getElementById('metadata'),
        saveBtn: document.getElementById('save-btn'),
        detailTitle: document.getElementById('detail-title'),
        detailContent: document.getElementById('detail-content'),
        attachBtn: document.getElementById('attach-btn'),
        linkedState: document.getElementById('linked-state'),
        linkedWrap: document.getElementById('linked-wrap'),
        linkedRows: document.getElementById('linked-rows'),
        attachDialog: document.getElementById('attach-dialog'),
        attachForm: document.getElementById('attach-form'),
        attachSearch: document.getElementById('attach-search'),
        attachOptions: document.getElementById('attach-options'),
        attachMessage: document.getElementById('attach-message'),
        attachSaveBtn: document.getElementById('attach-save-btn'),
      };

      function requireAuth() {
        const rawUser = localStorage.getItem('user');
        if (!rawUser) {
          window.location.href = '/signin.html';
          return null;
        }
        try {
          const user = JSON.parse(rawUser);
          if (!READ_ROLES.has(user.role)) {
            showToast('Your role cannot access services.', 'error');
            return null;
          }
          state.user = user;
          state.canMutate = MUTATE_ROLES.has(user.role);
          els.userMeta.textContent = `${user.name} · ${user.role}`;
          els.createBtn.hidden = !state.canMutate;
          return user;
        } catch {
          window.location.href = '/signin.html';
          return null;
        }
      }

      function showToast(text, kind) {
        els.toast.className = `message ${kind || ''}`;
        els.toast.textContent = text || '';
      }

      function formatError(data, fallback) {
        if (!data) return fallback;
        if (Array.isArray(data.message)) return data.message.join(', ');
        if (data.message) return String(data.message);
        return fallback;
      }

      async function api(path, options = {}) {
        const accessToken = localStorage.getItem('accessToken');
        const response = await fetch(path, {
          ...options,
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            ...(accessToken ? { Authorization: `Bearer ${accessToken}` } : {}),
            ...(options.headers || {}),
          },
        });

        if (response.status === 401) {
          localStorage.removeItem('accessToken');
          localStorage.removeItem('user');
          window.location.href = '/signin.html';
          throw new Error('Session expired');
        }

        const text = await response.text();
        const data = text ? JSON.parse(text) : null;

        if (!response.ok) {
          const error = new Error(formatError(data, 'Request failed'));
          error.status = response.status;
          error.data = data;
          throw error;
        }
        return data;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;');
      }

      function statusLabel(isActive) {
        return isActive ? 'ACTIVE' : 'INACTIVE';
      }

      function buildQuery() {
        const params = new URLSearchParams();
        params.set('page', String(state.page));
        params.set('limit', String(state.limit));
        params.set('sortBy', 'createdAt');
        params.set('sortOrder', 'desc');
        const search = els.search.value.trim();
        const status = els.statusFilter.value;
        if (search) params.set('search', search);
        if (status) params.set('status', status);
        return params.toString();
      }

      async function loadServices() {
        state.loading = true;
        els.listState.hidden = false;
        els.listState.className = 'loading';
        els.listState.textContent = 'Loading services…';
        els.tableWrap.hidden = true;

        try {
          const result = await api(`/services?${buildQuery()}`);
          const rows = result.data || [];
          state.totalPages = Math.max(result.meta?.totalPages || 0, 1);

          if (!rows.length) {
            els.listState.className = 'empty';
            els.listState.textContent = 'No services found.';
            return;
          }

          els.rows.innerHTML = rows
            .map((item) => {
              const status = statusLabel(item.isActive);
              const actions = [
                `<button type="button" class="secondary" data-action="view" data-id="${item.id}">View</button>`,
              ];
              if (state.canMutate) {
                actions.push(
                  `<button type="button" class="secondary" data-action="edit" data-id="${item.id}">Edit</button>`,
                );
                if (item.isActive) {
                  actions.push(
                    `<button type="button" class="secondary" data-action="deactivate" data-id="${item.id}">Deactivate</button>`,
                  );
                } else {
                  actions.push(
                    `<button type="button" class="secondary" data-action="activate" data-id="${item.id}">Activate</button>`,
                  );
                }
                actions.push(
                  `<button type="button" class="danger" data-action="delete" data-id="${item.id}">Delete</button>`,
                );
              }
              return `<tr>
                <td>${escapeHtml(item.name)}</td>
                <td>${item.durationMinutes} min</td>
                <td>${item.bufferBeforeMinutes}/${item.bufferAfterMinutes}</td>
                <td><span class="status ${item.isActive ? 'active' : 'inactive'}">${status}</span></td>
                <td>${new Date(item.createdAt).toLocaleString()}</td>
                <td><div class="actions">${actions.join('')}</div></td>
              </tr>`;
            })
            .join('');

          els.pageMeta.textContent = `Page ${result.meta.page} of ${state.totalPages} · ${result.meta.total} total`;
          els.prevPage.disabled = state.page <= 1;
          els.nextPage.disabled = state.page >= state.totalPages;
          els.listState.hidden = true;
          els.tableWrap.hidden = false;
        } catch (error) {
          if (error.status === 403) {
            els.listState.className = 'error-state';
            els.listState.textContent = 'You do not have permission to view services.';
            return;
          }
          els.listState.className = 'error-state';
          els.listState.textContent = error.message || 'Failed to load services.';
        } finally {
          state.loading = false;
        }
      }

      function parseMetadata(raw, messageEl) {
        const text = raw.trim();
        if (!text) return {};
        try {
          const parsed = JSON.parse(text);
          if (
            typeof parsed !== 'object' ||
            parsed === null ||
            Array.isArray(parsed)
          ) {
            messageEl.className = 'message error';
            messageEl.textContent = 'Metadata must be a JSON object.';
            return null;
          }
          return parsed;
        } catch {
          messageEl.className = 'message error';
          messageEl.textContent = 'Metadata must be valid JSON.';
          return null;
        }
      }

      function openCreate() {
        els.formTitle.textContent = 'Create service';
        els.editId.value = '';
        els.name.value = '';
        els.description.value = '';
        els.durationMinutes.value = '60';
        els.bufferBeforeMinutes.value = '0';
        els.bufferAfterMinutes.value = '0';
        els.metadata.value = '{}';
        els.formMessage.textContent = '';
        els.formMessage.className = 'message';
        els.formDialog.showModal();
      }

      async function openEdit(id) {
        try {
          const result = await api(`/services?id=${id}`);
          const item = result.data;
          els.formTitle.textContent = 'Edit service';
          els.editId.value = item.id;
          els.name.value = item.name;
          els.description.value = item.description || '';
          els.durationMinutes.value = String(item.durationMinutes);
          els.bufferBeforeMinutes.value = String(item.bufferBeforeMinutes);
          els.bufferAfterMinutes.value = String(item.bufferAfterMinutes);
          els.metadata.value = JSON.stringify(item.metadata || {}, null, 2);
          els.formMessage.textContent = '';
          els.formMessage.className = 'message';
          els.formDialog.showModal();
        } catch (error) {
          showToast(error.message || 'Failed to load service.', 'error');
        }
      }

      function setDetailTab(tab) {
        state.detailTab = tab;
        document.querySelectorAll('#detail-dialog .tabs button').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        document.getElementById('tab-overview').hidden = tab !== 'overview';
        document.getElementById('tab-resources').hidden = tab !== 'resources';
        document.getElementById('tab-bookings').hidden = tab !== 'bookings';
        if (tab === 'resources' && state.detailServiceId) {
          loadLinkedResources(state.detailServiceId);
        }
      }

      async function openDetail(id) {
        try {
          const result = await api(`/services?id=${id}`);
          const item = result.data;
          state.detailServiceId = item.id;
          els.detailTitle.textContent = item.name;
          els.attachBtn.hidden = !state.canMutate;
          els.detailContent.innerHTML = `
            <div><dt>Name</dt><dd>${escapeHtml(item.name)}</dd></div>
            <div><dt>Description</dt><dd>${escapeHtml(item.description || '—')}</dd></div>
            <div><dt>Duration</dt><dd>${item.durationMinutes} minutes</dd></div>
            <div><dt>Buffer before</dt><dd>${item.bufferBeforeMinutes} minutes</dd></div>
            <div><dt>Buffer after</dt><dd>${item.bufferAfterMinutes} minutes</dd></div>
            <div><dt>Status</dt><dd><span class="status ${item.isActive ? 'active' : 'inactive'}">${statusLabel(item.isActive)}</span></dd></div>
            <div><dt>Created</dt><dd>${new Date(item.createdAt).toLocaleString()}</dd></div>
            <div><dt>Updated</dt><dd>${new Date(item.updatedAt).toLocaleString()}</dd></div>
            <div><dt>Metadata</dt><dd><pre>${escapeHtml(JSON.stringify(item.metadata || {}, null, 2))}</pre></dd></div>
          `;
          setDetailTab('overview');
          els.detailDialog.showModal();
        } catch (error) {
          showToast(error.message || 'Failed to load service.', 'error');
        }
      }

      async function loadLinkedResources(serviceId) {
        els.linkedState.hidden = false;
        els.linkedState.className = 'loading';
        els.linkedState.textContent = 'Loading resources…';
        els.linkedWrap.hidden = true;

        try {
          const result = await api(
            `/services/${serviceId}/resources`,
          );
          state.linkedResources = result.data || [];

          if (!state.linkedResources.length) {
            els.linkedState.className = 'empty';
            els.linkedState.textContent = 'No resources attached yet.';
            return;
          }

          els.linkedRows.innerHTML = state.linkedResources
            .map((item) => {
              const actions = state.canMutate
                ? `<button type="button" class="danger" data-action="detach" data-id="${item.id}">Detach</button>`
                : '—';
              return `<tr>
                <td>${escapeHtml(item.name)}</td>
                <td>${escapeHtml(item.resourceType || '—')}</td>
                <td><span class="status ${item.status === 'ACTIVE' ? 'active' : 'inactive'}">${escapeHtml(item.status)}</span></td>
                <td>${actions}</td>
              </tr>`;
            })
            .join('');

          els.linkedState.hidden = true;
          els.linkedWrap.hidden = false;
        } catch (error) {
          els.linkedState.className = 'error-state';
          els.linkedState.textContent =
            error.message || 'Failed to load linked resources.';
        }
      }

      function renderAttachOptions(filter = '') {
        const needle = filter.trim().toLowerCase();
        const linkedIds = new Set(state.linkedResources.map((item) => item.id));
        const candidates = state.attachCandidates
          .filter((item) => !linkedIds.has(item.id))
          .filter((item) =>
            !needle ? true : String(item.name).toLowerCase().includes(needle),
          )
          .sort((a, b) => {
            if (a.status !== b.status) {
              return a.status === 'ACTIVE' ? -1 : 1;
            }
            return String(a.name).localeCompare(String(b.name));
          });

        if (!candidates.length) {
          els.attachOptions.innerHTML =
            '<div class="empty">No matching resources available.</div>';
          return;
        }

        els.attachOptions.innerHTML = candidates
          .map(
            (item) => `<label class="resource-option">
              <input type="radio" name="attach-resource" value="${item.id}" ${
              state.selectedResourceId === item.id ? 'checked' : ''
            } />
              <span>
                <strong>${escapeHtml(item.name)}</strong>
                <span class="muted"> · ${escapeHtml(item.resourceType || 'untyped')} · ${escapeHtml(item.status)}</span>
              </span>
            </label>`,
          )
          .join('');
      }

      async function openAttachDialog() {
        if (!state.detailServiceId) return;
        els.attachMessage.textContent = '';
        els.attachMessage.className = 'message';
        els.attachSearch.value = '';
        state.selectedResourceId = null;
        els.attachOptions.innerHTML = '<div class="loading">Loading resources…</div>';
        els.attachDialog.showModal();

        try {
          const result = await api(
            '/resources?page=1&limit=100&sortBy=name&sortOrder=asc',
          );
          state.attachCandidates = result.data || [];
          renderAttachOptions();
        } catch (error) {
          els.attachOptions.innerHTML = `<div class="error-state">${escapeHtml(
            error.message || 'Failed to load resources.',
          )}</div>`;
        }
      }

      els.form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const metadata = parseMetadata(els.metadata.value, els.formMessage);
        if (metadata === null) return;

        const payload = {
          name: els.name.value.trim(),
          description: els.description.value.trim() || null,
          durationMinutes: Number(els.durationMinutes.value),
          bufferBeforeMinutes: Number(els.bufferBeforeMinutes.value || 0),
          bufferAfterMinutes: Number(els.bufferAfterMinutes.value || 0),
          metadata,
        };

        els.saveBtn.disabled = true;
        els.formMessage.className = 'message';
        els.formMessage.textContent = '';

        try {
          const editId = els.editId.value;
          if (editId) {
            await api('/services', {
              method: 'PATCH',
              body: JSON.stringify({ id: editId, ...payload }),
            });
            showToast('Service updated.', 'success');
          } else {
            await api('/services', {
              method: 'POST',
              body: JSON.stringify(payload),
            });
            showToast('Service created.', 'success');
          }
          els.formDialog.close();
          await loadServices();
        } catch (error) {
          els.formMessage.className = 'message error';
          els.formMessage.textContent = error.message || 'Save failed.';
        } finally {
          els.saveBtn.disabled = false;
        }
      });

      els.attachForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const selected = els.attachForm.querySelector(
          'input[name="attach-resource"]:checked',
        );
        if (!selected) {
          els.attachMessage.className = 'message error';
          els.attachMessage.textContent = 'Select a resource to attach.';
          return;
        }

        els.attachSaveBtn.disabled = true;
        els.attachMessage.className = 'message';
        els.attachMessage.textContent = '';

        try {
          await api(`/services/${state.detailServiceId}/resources`, {
            method: 'POST',
            body: JSON.stringify({
              resourceId: selected.value,
            }),
          });
          showToast('Resource attached.', 'success');
          els.attachDialog.close();
          await loadLinkedResources(state.detailServiceId);
        } catch (error) {
          els.attachMessage.className = 'message error';
          els.attachMessage.textContent = error.message || 'Attach failed.';
        } finally {
          els.attachSaveBtn.disabled = false;
        }
      });

      els.rows.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const { action, id } = button.dataset;

        try {
          if (action === 'view') {
            await openDetail(id);
          } else if (action === 'edit') {
            await openEdit(id);
          } else if (action === 'activate') {
            await api('/services', {
              method: 'PATCH',
              body: JSON.stringify({ id, isActive: true }),
            });
            showToast('Service activated.', 'success');
            await loadServices();
          } else if (action === 'deactivate') {
            await api('/services', {
              method: 'PATCH',
              body: JSON.stringify({ id, isActive: false }),
            });
            showToast('Service deactivated.', 'success');
            await loadServices();
          } else if (action === 'delete') {
            if (
              !window.confirm(
                'Delete this service? Prefer deactivation if it has bookings.',
              )
            ) {
              return;
            }
            await api(`/services?id=${id}`, { method: 'DELETE' });
            showToast('Service deleted.', 'success');
            await loadServices();
          }
        } catch (error) {
          showToast(error.message || 'Action failed.', 'error');
        }
      });

      els.linkedRows.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-action="detach"]');
        if (!button || !state.detailServiceId) return;
        if (!window.confirm('Detach this resource from the service?')) return;

        try {
          await api(
            `/services/${state.detailServiceId}/resources/${button.dataset.id}`,
            { method: 'DELETE' },
          );
          showToast('Resource detached.', 'success');
          await loadLinkedResources(state.detailServiceId);
        } catch (error) {
          showToast(error.message || 'Detach failed.', 'error');
        }
      });

      document
        .querySelectorAll('#detail-dialog .tabs button')
        .forEach((button) => {
          button.addEventListener('click', () => setDetailTab(button.dataset.tab));
        });

      els.createBtn.addEventListener('click', openCreate);
      els.attachBtn.addEventListener('click', openAttachDialog);
      document.getElementById('cancel-form').addEventListener('click', () => {
        els.formDialog.close();
      });
      document.getElementById('cancel-attach').addEventListener('click', () => {
        els.attachDialog.close();
      });
      document.getElementById('close-detail').addEventListener('click', () => {
        els.detailDialog.close();
      });

      els.attachOptions.addEventListener('change', (event) => {
        if (event.target.name === 'attach-resource') {
          state.selectedResourceId = event.target.value;
        }
      });

      let searchTimer;
      els.search.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.page = 1;
          loadServices();
        }, 250);
      });
      els.statusFilter.addEventListener('change', () => {
        state.page = 1;
        loadServices();
      });
      els.attachSearch.addEventListener('input', () => {
        renderAttachOptions(els.attachSearch.value);
      });

      els.prevPage.addEventListener('click', () => {
        if (state.page > 1) {
          state.page -= 1;
          loadServices();
        }
      });
      els.nextPage.addEventListener('click', () => {
        if (state.page < state.totalPages) {
          state.page += 1;
          loadServices();
        }
      });

      document.getElementById('logout-btn').addEventListener('click', async () => {
        try {
          await api('/auth/logout', { method: 'POST', body: '{}' });
        } catch {
          /* ignore */
        }
        localStorage.removeItem('accessToken');
        localStorage.removeItem('user');
        window.location.href = '/signin.html';
      });

      if (requireAuth()) {
        loadServices();
      }
    </script>
  </body>
</html>
